[package]
name = "gp-tray"
version = "2.0.0"
edition = "2024"
description = "GlobalProtect VPN tray indicator"
license = "MIT"
repository = "https://github.com/Its-Alex/gp-tray"

[dependencies]
anyhow = "1"
futures-util = "0.3"
ksni = { version = "0.3", features = ["tokio"] }
notify-rust = { version = "4", default-features = false, features = ["z-with-tokio"] }
rtnetlink = "0.23"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
zbus = { version = "5", features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
