name: Publish to AUR

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # push the pinned PKGBUILD back to main

jobs:
  aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Pin pkgver and tarball sha256 in PKGBUILD
        run: scripts/release.sh prepare "$VERSION"

      - name: Commit pinned PKGBUILD back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/arch/PKGBUILD
          git diff --cached --quiet || {
            git commit -m "packaging: $VERSION-1"
            git push origin main
          }

      - name: Publish to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: gp-tray
          pkgbuild: packaging/arch/PKGBUILD
          assets: packaging/arch/gp-tray.install
          commit_username: ItsAlex
          commit_email: me@itsalex.fr
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "${{ env.VERSION }}-1: upstream release v${{ env.VERSION }}"
          test: true # build the package in an Arch container before pushing
