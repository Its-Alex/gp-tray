# Handoff directory for the single-use SAML cookie, written by the user's
# gp-tray and read (as a systemd credential) by gp-tray-tunnel@.service.
# World-writable with the sticky bit, /tmp-style: the tray creates the
# cookie 0600/O_EXCL and the service unlinks it right after start.
d /run/gp-tray 1777 root root -
